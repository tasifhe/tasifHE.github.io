<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Not Found | THE Portfolio</title>
  <meta name="description" content="Page not found - Return to THE Portfolio homepage">
  <meta name="robots" content="noindex, nofollow">
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
      color: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Rajdhani', 'Segoe UI', Arial, sans-serif;
      overflow: hidden;
      position: relative;
    }
    body::before {
      content: '';
      position: absolute;
      width: 200%;
      height: 200%;
      background: 
        radial-gradient(circle at 20% 50%, rgba(0, 120, 255, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(0, 198, 255, 0.1) 0%, transparent 50%);
      animation: float 15s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(-30px, -30px) rotate(5deg); }
    }
    .error-container {
      text-align: center;
      position: relative;
      z-index: 10;
      padding: 2rem;
    }
    .glitch-wrapper {
      position: relative;
      display: inline-block;
    }
    .error-code {
      font-size: 10rem;
      font-weight: 700;
      color: #0078ff;
      text-shadow: 
        0 0 20px rgba(0, 120, 255, 0.5),
        0 0 40px rgba(0, 120, 255, 0.3);
      letter-spacing: 0.2rem;
      position: relative;
      animation: glitch 2s infinite;
    }
    @keyframes glitch {
      0%, 90%, 100% {
        transform: translate(0);
      }
      30% {
        transform: translate(-5px, 5px);
      }
      60% {
        transform: translate(5px, -5px);
      }
    }
    .error-icon {
      font-size: 4rem;
      color: #00c6ff;
      margin-bottom: 1rem;
      animation: bounce 2s ease-in-out infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }
    .error-message {
      font-size: 2.5rem;
      margin: 1.5rem 0;
      font-weight: 600;
      letter-spacing: 2px;
      color: #FFD700;
      text-transform: uppercase;
    }
    .error-description {
      font-size: 1.2rem;
      color: #b0b0b0;
      margin-bottom: 2rem;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    .home-link {
      display: inline-block;
      margin-top: 2rem;
      padding: 1rem 3rem;
      background: linear-gradient(90deg, #0078ff 0%, #00c6ff 100%);
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: all 0.3s ease;
      border: 2px solid transparent;
      position: relative;
      overflow: hidden;
    }
    .home-link::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s;
    }
    .home-link:hover::before {
      left: 100%;
    }
    .home-link:hover {
      background: linear-gradient(90deg, #005fa3 0%, #0078ff 100%);
      color: #fff;
      text-decoration: none;
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(0, 120, 255, 0.4);
      border-color: #00c6ff;
    }
    .decorative-lines {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      opacity: 0.1;
    }
    .decorative-lines::before,
    .decorative-lines::after {
      content: '';
      position: absolute;
      background: #0078ff;
    }
    .decorative-lines::before {
      width: 2px;
      height: 200%;
      left: 20%;
      animation: slideY 10s linear infinite;
    }
    .decorative-lines::after {
      width: 200%;
      height: 2px;
      top: 30%;
      animation: slideX 12s linear infinite;
    }
    @keyframes slideY {
      from { transform: translateY(-50%); }
      to { transform: translateY(50%); }
    }
    @keyframes slideX {
      from { transform: translateX(-50%); }
      to { transform: translateX(50%); }
    }
    @media (max-width: 768px) {
      .error-code {
        font-size: 6rem;
      }
      .error-message {
        font-size: 1.8rem;
      }
      .error-description {
        font-size: 1rem;
        padding: 0 1rem;
      }
      .home-link {
        padding: 0.8rem 2rem;
        font-size: 1rem;
      }
    }
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="decorative-lines"></div>
  <div class="error-container">
    <div class="error-icon">
      <i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>
    </div>
    <div class="glitch-wrapper">
      <div class="error-code">404</div>
    </div>
    <h1 class="error-message">Mission Failed</h1>
    <p class="error-description">
      The page you're looking for has been relocated to another dimension.
      Our scouts are on it, but in the meantime, let's get you back to base.
    </p>
    <a href="index.html" class="home-link">
      <i class="bi bi-house-fill" aria-hidden="true"></i> Return to Base
    </a>
  </div>
</body>
</html>
